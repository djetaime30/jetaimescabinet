<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jetaime’s Cabinet • Loose Pages</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --mist: #0f0f1a; --ink: #e8d5b7; --gold: #d4af37; }
  body { margin:0; font-family: Georgia, serif; background:var(--mist); color:var(--ink); line-height:1.65; }
  header { text-align:center; padding:2.5rem 1rem 1.5rem; border-bottom:1px solid #333; }
  h1 { font-size:2.4rem; letter-spacing:4px; margin:0 0 0.3rem; }
  .subtitle { font-style:italic; opacity:0.75; font-size:1.05rem; }
  .controls { padding:1.2rem; display:flex; gap:0.8rem; flex-wrap:wrap; justify-content:center; background:#111; position:sticky; top:0; z-index:10; }
  button { background:#222; color:var(--ink); border:1px solid #444; padding:0.75rem 1.4rem; border-radius:999px; cursor:pointer; font-size:0.95rem; transition:all 0.2s; }
  button:hover { background:#333; border-color:var(--gold); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1.8rem; padding:2.5rem; max-width:1400px; margin:0 auto; }
  .card { border-radius:10px; overflow:hidden; box-shadow:0 12px 35px rgba(0,0,0,0.65); transition:transform 0.3s cubic-bezier(0.23,1,0.32,1); cursor:pointer; position:relative; background:#111; }
  .card:hover { transform:scale(1.045); }
  .card img { width:100%; height:300px; object-fit:cover; display:block; }
  .card .title { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,#000000cc); padding:1.1rem 1rem 0.9rem; font-size:1.05rem; line-height:1.3; }
  .modal { display:none; position:fixed; inset:0; background:rgba(5,5,15,0.97); align-items:center; justify-content:center; padding:1rem; z-index:100; }
  .modal-content { max-width:1200px; width:100%; display:grid; grid-template-columns:1fr 1fr; gap:2.5rem; background:#111; border-radius:14px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,0.8); }
  .modal img { width:100%; height:100%; object-fit:contain; background:#0a0a12; }
  .poem { padding:2.2rem 2.5rem; overflow-y:auto; max-height:85vh; font-size:1.05rem; }
  .poem h2 { margin-top:0; color:var(--gold); font-size:1.35rem; }
  .progress { text-align:center; padding:0.8rem; font-size:0.95rem; opacity:0.85; }
  footer { text-align:center; padding:2rem 1rem; font-size:0.85rem; opacity:0.6; }
</style>
</head>
<body>

<header>
  <h1>Jetaime’s Cabinet</h1>

</header>

<div class="controls">
  <button onclick="shuffleDeck()">🌀 Shuffle the Deck</button>
  <button onclick="drawRandom()">🌙 Draw One for Tonight</button>

</div>

<div class="progress" id="progress">0 of 12 pages have already found you</div>

<div class="grid" id="gallery"></div>

<div id="modal" class="modal" onclick="if(event.target.id==='modal')hideModal()">
  <div class="modal-content" onclick="event.stopImmediatePropagation()">
    <img id="modalImage" alt="">
    <div class="poem" id="modalPoem"></div>
  </div>
</div>

<footer>
  Non-commercial • For the ones who need the quiet magic • Made in the Cabinet 🕯️
</footer>

// ====================== THE MAGIC ======================
let viewed = JSON.parse(localStorage.getItem('viewedPages')) || {};

function renderGallery(filtered = pages) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  filtered.forEach(page => {
    const div = document.createElement('div');
    div.className = 'card';
    const isViewed = viewed[page.id] ? '✓ whispered' : '';
    div.innerHTML = `
      <img src="${page.img}" alt="${page.title}">
      <div class="title">${page.title}<br><small style="opacity:0.65">${isViewed}</small></div>
    `;
    div.onclick = () => openPage(page);
    gallery.appendChild(div);
  });
  updateProgress();
}

function openPage(page) {
  viewed[page.id] = true;
  localStorage.setItem('viewedPages', JSON.stringify(viewed));
  document.getElementById('modalImage').src = page.img;
  document.getElementById('modalPoem').innerHTML = `<h2>${page.title}</h2><pre style="white-space:pre-wrap;font-family:inherit">${page.text}</pre>`;
  document.getElementById('modal').style.display = 'flex';
  updateProgress();
  renderGallery();
}

function hideModal() {
  document.getElementById('modal').style.display = 'none';
}

function shuffleDeck() {
  const shuffled = [...pages].sort(() => Math.random() - 0.5);
  renderGallery(shuffled);
}

function drawRandom() {
  const random = pages[Math.floor(Math.random() * pages.length)];
  openPage(random);
}

function showViewed() {
  const seen = pages.filter(p => viewed[p.id]);
  if (seen.length === 0) {
    alert("You haven’t opened any pages yet. Go explore the deck!");
    return;
  }
  let html = `<h2 style="margin-top:0">Pages that have whispered to you</h2><ul style="line-height:2">`;
  seen.forEach(p => html += `<li>${p.title}</li>`);
  html += `</ul><p style="margin-top:1.5rem;opacity:0.7">These are saved only in your browser. Clear your cache and they reset.</p>`;
  const win = window.open("", "ViewedPages", "width=500,height=600");
  win.document.body.innerHTML = `<div style="padding:2rem;font-family:Georgia,serif;background:#111;color:#e8d5b7">${html}</div>`;
}

function updateProgress() {
  const total = pages.length;
  const seen = Object.keys(viewed).length;
  document.getElementById('progress').innerHTML = `${seen} of ${total} pages have already found you <span style="font-size:1.3rem">🕯️</span>`;
}

// Boot everything
renderGallery();
</script>
